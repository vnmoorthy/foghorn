name: Bug report
description: Something in Foghorn is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If Foghorn reported a wrong accessibility finding, please use the **Accessibility finding** template instead.
        Do not include API keys, private URLs or page content you are not allowed to share.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app with `npm run dev`
        2. Scan `/demo/driftwood`
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scan / personas
        - Blind agent run
        - Fixes / approval / verification
        - Evidence export / report
        - Monitors
        - boat.dev VM / live desktop
        - UI
        - Setup / build
        - Other
    validations:
      required: true
  - type: dropdown
    id: providers
    attributes:
      label: Which integrations were configured?
      multiple: true
      options:
        - None (offline fallbacks)
        - NY Token Exchange (NYTE_API_KEY)
        - OpenAI / Anthropic key
        - Context.dev (CONTEXT_DEV_API_KEY)
        - boat.dev (BOAT_API_KEY)
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, browser
      placeholder: macOS 15, Node 22.11, Chrome 131
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output or browser console errors. This will be rendered as code.
      render: shell
